name         = "thecount"
repository   = "https://github.com/jimmyhmiller/TheCount"
version-flag = "--version"

[run]
args           = ["{target}"]
json           = ["--output", "json"]
languages      = ["--extensions", "{extensions}"]
same-work      = ["--hidden", "--no-ignore", "--no-config", "--no-unknown"]
same-work-note = "dotted directories entered, .gitignore disabled, user language config disabled, and files with no recognized language skipped (other tools do not count them); extension filtering excludes exact filenames without the selected extensions"

[read]
files    = "total.files"
lines    = "total.lines"
code     = "total.code"
comments = "total.comments"
blanks   = "total.blanks"
